# t7drop server settings: /etc/t7drop/server.conf on the VPS. Sizes take K, M or G.

[server]
listen = 127.0.0.1:8765
data_dir = /var/lib/t7drop

[limits]
max_item_bytes = 200M
max_total_bytes = 2G
max_meta_bytes = 4096
max_items_per_device = 200
unfinished_hours = 24
undelivered_days = 7
delivered_days = 7
