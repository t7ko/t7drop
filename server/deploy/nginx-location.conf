# t7drop: written by t7drop's nginx-hook.sh from server/deploy/nginx-location.conf;
# uninstall.sh removes it. See docs/deployment.md.
location ^~ /@PREFIX@/ {
    # The snippet that includes this file is in a second server as well:
    # t7drop answers only in the web hostname's server.
    if ($server_port != @PORT@) { return 404; }

    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $proxy_protocol_addr;

    # t7drop's own status codes reach the clients; nginx's own errors still become the
    # site's 404, without t7drop's header, which clients treat as temporary.
    proxy_intercept_errors off;

    # 4 MiB chunks pass in memory, never through nginx's temporary files.
    client_max_body_size 5m;
    client_body_buffer_size 5m;
    proxy_max_temp_file_size 0;

    # Long polls hold for up to 55 s.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
